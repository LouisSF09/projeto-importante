<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGames - Carrinho</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h2>LGames</h2>
        <nav>
            <a href="index.html">Início</a>
            <a href="jogos.html">Jogos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="planilha.html" aria-current="page">Planilha</a>
        </nav>
        <div id="tema-toggle" class="tema-toggle">
            <div class="bolinha"></div>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <h1>Carrinho</h1>
        <form class="carrinho-form" action="https://script.google.com/macros/s/AKfycbwGLNojVvJgvL6-RdHYASHFzD3MwGJ3LRnNUG_Bd5k7Fq6vpZsDyez6Ao2JhHBIy8aN/exec" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Nome Sobrenome" required>

            <label for="nome">Jogo:</label>
            <input type="text" id="jogo" name="jogo" placeholder="Jogo" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="nome.sobrenome@email.com" required>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(99) 99999-9999" required>

            <label>Forma de Pagamento:</label>
            <label for="debit">Débito</label>
            <input type="radio" id="pagamento" name="pagamento" value="Débito">
            <label for="credit">Crédito</label>
            <input type="radio" id="pagamento" name="pagamento" value="Crédito">
            <label for="pix">Pix</label>
            <input type="radio" id="pagamento" name="pagamento" value="Pix">
            <label for="bolet">Boleto</label>
            <input type="radio" id="pagamento" name="pagamento" value="Boleto">

            <button type="submit">Enviar</button>
        </form>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2025 LGames - Todos os direitos reservados</p>
    </footer>
    
<script>
  const toggle = document.getElementById("tema-toggle");
  const body = document.body;

  // Carregar tema salvo
  let tema = localStorage.getItem("tema") || "tema-claro";
  if (tema === "tema-escuro") body.classList.add("tema-escuro");

  toggle.addEventListener("click", () => {
    body.classList.toggle("tema-escuro");

    const ativo = body.classList.contains("tema-escuro");
    localStorage.setItem("tema", ativo ? "tema-escuro" : "tema-claro");
  });
</script>

</body>

</html>
